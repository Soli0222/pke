cluster: meruto
kubeContext: meruto@soli

cilium:
  # meruto は IPv4 のみ（K3s の CIDR も host_vars で IPv4 だけにしている）。
  ipv6Enabled: false
  clusterPoolIPv4PodCIDRList:
    - "10.1.0.0/16"
  clusterPoolIPv4MaskSize: 24
  ipv4NativeRoutingCIDR: "10.1.0.0/16"
  k8sServiceHost: "192.168.50.2"
  k8sServicePort: 6443

onepassword:
  accessTokenItem: "PKE-natsume Access Token: PKE-natsume"
  credentialsFile: "PKE-natsume Credentials File"

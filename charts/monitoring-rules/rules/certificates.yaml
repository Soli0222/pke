rules:
- alert: CertManagerCertNotReady
  expr: |-
    label_replace(max by (cluster, exported_namespace, name) (certmanager_certificate_ready_status{exported_namespace!~"{{ .Values.exclusions.namespaces }}",condition="True"}) == 0, "namespace", "$1", "exported_namespace", "(.+)")
  summary: 証明書 NotReady {{ $labels.namespace }}/{{ $labels.name }}
  description: Certificate、CertificateRequest、Order、Challenge を順に調べてください。
- alert: CertExpiringSoon
  expr: |-
    label_replace(((max by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace!~"{{ .Values.exclusions.namespaces }}"}) - time() < {{ .Values.groups.certificates.rules.CertExpiringSoon.days }} * 86400) unless on (cluster, exported_namespace, name) (max by (cluster, exported_namespace, name) (certmanager_certificate_renewal_timestamp_seconds{exported_namespace!~"{{ .Values.exclusions.namespaces }}"}) > time())) or (max by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace!~"{{ .Values.exclusions.namespaces }}"}) < time()), "namespace", "$1", "exported_namespace", "(.+)")
  summary: 証明書期限 {{ $labels.namespace }}/{{ $labels.name }}
  description: 証明書の通常更新期間を越えて期限が近づいています。renewalTime と更新失敗を確認してください。
  family: certificate-expiry
- alert: CertExpiryCritical
  expr: |-
    label_replace(((max by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace!~"{{ .Values.exclusions.namespaces }}"}) - time() < {{ .Values.groups.certificates.rules.CertExpiryCritical.days }} * 86400) unless on (cluster, exported_namespace, name) (max by (cluster, exported_namespace, name) (certmanager_certificate_renewal_timestamp_seconds{exported_namespace!~"{{ .Values.exclusions.namespaces }}"}) > time())) or (max by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace!~"{{ .Values.exclusions.namespaces }}"}) < time()), "namespace", "$1", "exported_namespace", "(.+)")
  summary: 証明書期限 {{ $labels.namespace }}/{{ $labels.name }}
  description: 証明書の通常更新期間を越えて期限が近づいています。renewalTime と更新失敗を確認してください。
  family: certificate-expiry

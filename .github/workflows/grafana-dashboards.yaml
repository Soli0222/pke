name: grafana-dashboards

on:
  pull_request:
    paths:
      - 'grafana/**'
      - 'scripts/*grafana*'
      - '.github/workflows/grafana-dashboards.yaml'
      - 'ansible/inventories/hosts.yaml'
      - 'ansible/inventories/host_vars/*.yaml'
      - 'flux/clusters/*/apps/monitoring-rules/helmrelease-monitoring-rules.yaml'
      - 'flux/clusters/*/apps/*/helmrelease-*.yaml'
      - 'charts/monitoring-rules/**'
      - 'charts/blackbox-exporter-probes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install validator
        run: python3 -m pip install -r grafana/requirements.txt
      - uses: azure/setup-helm@v5.0.1
      - name: Check valid and invalid dashboard fixtures
        run: python3 scripts/test-grafana-dashboards.py
      - name: Check Git Sync setup boundaries
        run: python3 scripts/test-grafana-git-sync.py
      - name: Validate Git Sync files
        run: python3 scripts/validate-grafana-dashboards.py
      - name: Check expected host inventory
        run: python3 scripts/sync-grafana-host-inventory.py --check
      - name: Check host absence and systemd state semantics
        run: python3 scripts/test-grafana-host-inventory.py
      - name: Check etcd and certificate query semantics
        run: python3 scripts/test-grafana-platform-promql.py
      - name: Check pipeline expectations
        run: python3 scripts/sync-grafana-pipeline-inventory.py --check
      - name: Check pipeline absence and cluster semantics
        run: python3 scripts/test-grafana-pipeline.py

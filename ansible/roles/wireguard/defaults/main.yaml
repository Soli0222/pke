---
wireguard_interface: wg0
# トンネル内のアドレス。文字列または一覧。例: [10.99.0.1/24, fd00:10:99::1/64]
wireguard_address: []
# 0 のときは ListenPort を書かない（接続を始める側）。
wireguard_listen_port: 0
# 空のときは wg-quick の既定値を使う。
wireguard_mtu: ""
# 空のときは wg-quick の既定（auto）。AllowedIPs に 0.0.0.0/0 を含む peer があると、
# wg-quick は fwmark と ip rule でデフォルトルートを wg に向ける。
wireguard_table: ""

# 秘密鍵と公開鍵は 1Password の同じ item に置く。
# private_key は自ホストだけが読み、public_key は peer 側の設定に使う。
wireguard_onepassword_vault: Kubernetes
wireguard_onepassword_item: ""
wireguard_onepassword_private_key_field: private_key
wireguard_onepassword_public_key_field: public_key

# - name: peer の名前（設定ファイルのコメント用）
#   onepassword_item: peer の鍵を置いた item（public_key を読む）
#   allowed_ips: [10.99.0.2/32]
#   endpoint: "203.0.113.1:51820"   # 省略可
#   persistent_keepalive: 25         # 省略可
wireguard_peers: []

wireguard_config_dir: /etc/wireguard

# systemd-networkd は再設定時に自分が作っていない ip rule と経路を消す。
# wg-quick でデフォルトルートを wg に向けるホストでは true にし、netplan apply で消させない。
wireguard_networkd_keep_foreign_routes: false
wireguard_networkd_conf_file: /etc/systemd/networkd.conf.d/90-pke-wireguard.conf

# handshake の時刻と転送量を node exporter の textfile collector 向けに書き出す。
# 空のときは書き出さない。既定では install-alloy の textfile ディレクトリを使う。
wireguard_metrics_textfile_directory: "{{ alloy_textfile_directory | default('') }}"
wireguard_metrics_interval: 30s
wireguard_metrics_script: /usr/local/libexec/pke-wireguard-metrics
wireguard_metrics_unit: pke-wireguard-metrics

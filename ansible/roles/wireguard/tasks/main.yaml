---
- name: Validate WireGuard settings
  ansible.builtin.assert:
    that:
      - wireguard_interface | length > 0
      - wireguard_address | length > 0
      - wireguard_onepassword_vault | length > 0
      - wireguard_onepassword_item | length > 0
      - wireguard_peers | length > 0
      - wireguard_peers | rejectattr('onepassword_item', 'defined') | list | length == 0
      - wireguard_peers | rejectattr('allowed_ips', 'defined') | list | length == 0
    fail_msg: "WireGuard settings are incomplete for {{ inventory_hostname }}."

# wg0 を上げる前は外への経路がない場合がある。導入済みなら apt を実行しない。
# （cache_valid_time は update-success-stamp がないと lists ディレクトリの mtime で判定し、
#   apt-get update 後も古いと見なされることがある）
- name: Check whether WireGuard tools are installed
  ansible.builtin.stat:
    path: /usr/bin/wg
  register: wireguard_tools_binary

- name: Install WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
  when: not wireguard_tools_binary.stat.exists

- name: Ensure systemd-networkd configuration directory exists
  ansible.builtin.file:
    path: "{{ wireguard_networkd_conf_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: wireguard_networkd_keep_foreign_routes | bool

# wg-quick を起動する前に反映し、以後の netplan apply で ip rule が消えないようにする。
- name: Keep foreign routes and routing policy rules in systemd-networkd
  ansible.builtin.copy:
    dest: "{{ wireguard_networkd_conf_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # This file is managed by Ansible. Do not edit manually.
      [Network]
      ManageForeignRoutingPolicyRules=no
      ManageForeignRoutes=no
  register: wireguard_networkd_conf
  when: wireguard_networkd_keep_foreign_routes | bool

- name: Restart systemd-networkd to load the configuration
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
  when: wireguard_networkd_conf is changed

- name: Retrieve WireGuard private key from 1Password
  ansible.builtin.command:
    argv:
      - op
      - read
      - "op://{{ wireguard_onepassword_vault }}/{{ wireguard_onepassword_item }}/{{ wireguard_onepassword_private_key_field }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: wireguard_private_key
  no_log: true

- name: Retrieve WireGuard peer public keys from 1Password
  ansible.builtin.command:
    argv:
      - op
      - read
      - "op://{{ wireguard_onepassword_vault }}/{{ item.onepassword_item }}/{{ wireguard_onepassword_public_key_field }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: wireguard_peer_public_keys
  loop: "{{ wireguard_peers }}"
  loop_control:
    label: "{{ item.name | default(item.onepassword_item) }}"

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# 秘密鍵を含むため、--diff でも内容を出さない。
- name: Render WireGuard configuration
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started

- name: Write WireGuard peer names for metrics
  ansible.builtin.template:
    src: peers.j2
    dest: "{{ wireguard_config_dir }}/{{ wireguard_interface }}.peers"
    owner: root
    group: root
    mode: "0644"

- name: Configure WireGuard metrics
  when: wireguard_metrics_textfile_directory | length > 0
  block:
    - name: Ensure the textfile directory exists
      ansible.builtin.file:
        path: "{{ wireguard_metrics_textfile_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the WireGuard metrics script
      ansible.builtin.template:
        src: pke-wireguard-metrics.sh.j2
        dest: "{{ wireguard_metrics_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install the WireGuard metrics units
      ansible.builtin.template:
        src: "pke-wireguard-metrics.{{ item }}.j2"
        dest: "/etc/systemd/system/{{ wireguard_metrics_unit }}.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - service
        - timer
      register: wireguard_metrics_units

    - name: Enable the WireGuard metrics timer
      ansible.builtin.systemd:
        name: "{{ wireguard_metrics_unit }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      # check mode では unit ファイルが書かれないため、新規配置時は enable を確認できない。
      when: not (ansible_check_mode and wireguard_metrics_units.changed)

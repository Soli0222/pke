# CNPG instance の管理ラベル、親プロセス、イメージ、WAL ファイル名まで限定する。
# regex は Falco の full match。コマンド末尾への追加実行も除外しない。
- macro: postgres_running_cnpg
  condition: >-
    (container.name = postgres and proc.pname = postgres and user.name = postgres
     and proc.tty = 0
     and k8s.pod.label[app.kubernetes.io/managed-by] = cloudnative-pg
     and k8s.pod.label[cnpg.io/podRole] = instance
     and ((container.image.repository = ghcr.io/cloudnative-pg/postgresql
           and proc.pexepath = /usr/lib/postgresql/18/bin/postgres)
       or (container.image.repository = ghcr.io/soli0222/pgroonga-cnpg/4.0.6-alpine
           and proc.pexepath = /usr/local/bin/postgres))
     and proc.cmdline regex "sh -c (-- )?/controller/manager wal-archive --log-destination /controller/log/postgres[.]json pg_wal/([0-9A-F]{24}([.]partial|[.][0-9A-F]{8}[.]backup)?|[0-9A-F]{8}[.]history)")
  override:
    condition: replace

# Longhorn manager のマウント後始末。シェルや任意の Longhorn 子プロセスは対象外。
- macro: user_known_stand_streams_redirect_activities
  condition: >-
    or (k8s.ns.name = longhorn-system and container.name = longhorn-manager
        and container.image.repository = docker.io/longhornio/longhorn-manager
        and proc.exepath = /usr/local/sbin/longhorn-manager
        and proc.pname = longhorn and user.uid = 0 and proc.tty = 0
        and proc.cmdline = "longhorn backup cleanup-all-mounts")
  override:
    condition: append

# initramfs の root 行取り込み。grep 全般・任意の親プロセスは対象外。
- rule: Read sensitive file untrusted
  exceptions:
  - name: pke_dracut_root_shadow
    fields: [container.id, user.uid, proc.name, proc.exepath, proc.pname, proc.cmdline, fd.name, "proc.aname[2]", "proc.aname[3]", "proc.aname[4]"]
    comps: ["=", "=", "=", "=", "=", "=", "=", "=", "=", "="]
    values:
    - [host, 0, grep, /usr/bin/grep, dracut, "grep ^root: /etc/shadow", /etc/shadow, update-initramf, dracut.postinst, dpkg]
    - [host, 0, grep, /usr/bin/grep, dracut, "grep ^root: /etc/shadow", /etc/shadow, dracut, run-parts, sh]
  override:
    exceptions: append

# instance-manager の受信 RPC socket。外向き接続・任意のシェルは対象外。
- rule: Redirect STDOUT/STDIN to Network Connection in Container
  exceptions:
  - name: pke_longhorn_instance_manager_rpc
    fields: [k8s.ns.name, container.name, container.image.repository, proc.name, proc.pname, proc.exepath, proc.cmdline, user.uid, proc.tty, evt.type, fd.l4proto, fd.is_server, fd.lport]
    comps: ["=", "=", "=", "=", "=", in, "=", "=", "=", "=", "=", "=", in]
    values:
    - [longhorn-system, instance-manager, docker.io/longhornio/longhorn-instance-manager, longhorn-instan, longhorn-instan, [/tini, /usr/local/bin/longhorn-instance-manager], "longhorn-instan --debug daemon --listen :8500", 0, 0, dup3, tcp, true, [8500, 8501, 8503]]
  override:
    exceptions: append

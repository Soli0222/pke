---
- name: Install Falco apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download Falco repository key
  ansible.builtin.get_url:
    url: "{{ falco_apt_key_url }}"
    dest: "{{ falco_apt_key_asc_path }}"
    owner: root
    group: root
    mode: "0644"
  register: falco_apt_key

- name: Check Falco repository keyring
  ansible.builtin.stat:
    path: "{{ falco_apt_keyring_path }}"
  register: falco_apt_keyring

- name: Dearmor Falco repository key
  ansible.builtin.command:
    argv:
      - gpg
      - --yes
      - --dearmor
      - -o
      - "{{ falco_apt_keyring_path }}"
      - "{{ falco_apt_key_asc_path }}"
  when: falco_apt_key.changed or not falco_apt_keyring.stat.exists

- name: Set Falco repository keyring permissions
  ansible.builtin.file:
    path: "{{ falco_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Falco apt repository
  ansible.builtin.apt_repository:
    repo: "{{ falco_apt_repository }}"
    filename: falcosecurity
    state: present
    update_cache: true

- name: Install Falco
  ansible.builtin.apt:
    name: falco
    state: "{{ falco_package_state }}"
  environment:
    FALCO_FRONTEND: noninteractive
    FALCO_DRIVER_CHOICE: "{{ falco_driver_choice }}"
    FALCOCTL_ENABLED: "{{ 'yes' if falco_falcoctl_enabled | bool else 'no' }}"
  notify: Restart Falco

- name: Manage falcoctl artifact follow service
  ansible.builtin.systemd:
    name: falcoctl-artifact-follow.service
    masked: "{{ not falco_falcoctl_enabled | bool }}"
    enabled: "{{ falco_falcoctl_enabled | bool }}"
  failed_when: false

- name: Create Falco systemd drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ falco_service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Send Falco output to the journal
  ansible.builtin.copy:
    src: journal.conf
    dest: "/etc/systemd/system/{{ falco_service_name }}.service.d/10-journal.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Falco

- name: Create Falco config directory
  ansible.builtin.file:
    path: "{{ falco_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Falco for PKE
  ansible.builtin.template:
    src: pke.yaml.j2
    dest: "{{ falco_pke_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Falco

- name: Create Falco custom rules directory
  ansible.builtin.file:
    path: /etc/falco/rules.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure narrow PKE exceptions
  ansible.builtin.copy:
    src: pke-rules.yaml
    dest: /etc/falco/rules.d/pke-rules.yaml
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/falco -V /etc/falco/falco_rules.yaml -V %s
  notify: Restart Falco

- name: Validate complete Falco configuration before restart
  ansible.builtin.command: /usr/bin/falco --dry-run
  changed_when: false
  when: not ansible_check_mode

- name: Enable Falco modern eBPF service
  ansible.builtin.systemd:
    name: "{{ falco_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Install Falco restart units for the K3s containerd socket
  ansible.builtin.template:
    src: "falco-cri-socket-restart.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ falco_cri_socket_restart_unit }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - path
  register: falco_cri_socket_restart_units
  when: falco_cri_socket_restart_enabled | bool

- name: Enable Falco restart on K3s containerd socket creation
  ansible.builtin.systemd:
    name: "{{ falco_cri_socket_restart_unit }}.path"
    enabled: true
    state: started
    daemon_reload: true
  # check mode では unit ファイルが書かれないため、新規配置時は enable を確認できない。
  when:
    - falco_cri_socket_restart_enabled | bool
    - not (ansible_check_mode and falco_cri_socket_restart_units.changed)

- name: Remove Falco restart units on hosts without K3s
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ falco_cri_socket_restart_unit }}.{{ item }}"
    state: absent
  loop:
    - path
    - service
  when: not (falco_cri_socket_restart_enabled | bool)

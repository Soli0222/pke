---
ansible_host: lune-02
# K3s ノードではないが、meruto の出入口なので監視のラベルは meruto に寄せる。
cluster: meruto

alloy_systemd_units:
  - alloy.service
  - falco-modern-bpf.service
  - haproxy.service
  - nftables.service
  - wg-quick@wg0.service
  - pke-wireguard-metrics.timer
  - tailscaled.service
alloy_textfile_directory: /var/lib/alloy-textfile
alloy_extra_scrape_targets:
  - name: haproxy
    address: 127.0.0.1:8405
    metrics_path: /metrics

# コンテナを動かさないので、K3s の containerd socket を待つ unit は入れない。
falco_cri_socket_restart_enabled: false

# SSH は Tailscale SSH（tailscaled が直接処理）で入る。sshd はループバックだけで待ち受ける。
sshd_listen_addresses:
  - 127.0.0.1

ssh_agent_sudo_users:
  - name: soli
    github_user: soli0222
    login_authorized_keys: true
    sudo_authorized_keys: true
    lock_password: true

network_netplan:
  global:
    device: ens3
    ipv4:
      - 133.18.187.207/23
    # 事業者が割り当てた静的アドレス。RA による SLAAC のアドレスは使わない。
    ipv6:
      - 2406:8c00:0:3476:133:18:187:207/64
    default_route:
      - 133.18.186.1
      - 2406:8c00:0:3476::1
    nameservers:
      - 1.1.1.1
      - 1.0.0.1
    routes: []
  private: {}

wireguard_address:
  - 10.99.0.1/24
  - fd00:10:99::1/64
wireguard_listen_port: 51820
wireguard_onepassword_item: pke-wireguard-lune-02
wireguard_peers:
  - name: meruto-02
    onepassword_item: pke-wireguard-meruto-02
    allowed_ips:
      - 10.99.0.2/32
      - fd00:10:99::2/128

# SSH は Tailscale 経由だけにする。
edge_gateway_public_ssh_enabled: false
edge_gateway_egress_sources:
  - 10.99.0.2/32
edge_gateway_egress_sources_ipv6:
  - fd00:10:99::2/128
# 転送先は meruto の Traefik の NodePort（flux/clusters/meruto/apps/traefik で固定）。
edge_gateway_haproxy_backends:
  - name: http
    port: 80
    server_name: meruto-02
    target: 10.99.0.2:30080
  - name: https
    port: 443
    server_name: meruto-02
    target: 10.99.0.2:30443

---
ansible_host: natsume-03
cluster: natsume

alloy_systemd_units:
  - alloy.service
  - k3s.service
  - etcd.service
  - falco-modern-bpf.service

# vda5（200G）と vda4（598G）を VG topolvm にする。パーティションの作成は vda5 だけを対象にする。
topolvm_storage_parent_disk: /dev/vda
topolvm_storage_partition_number: 5
topolvm_storage_partition_size_mib: 0
topolvm_storage_partition_end: "100%"
topolvm_storage_devices:
  - /dev/vda5
  - /dev/vda4

ssh_agent_sudo_configure_sshd: false
ssh_agent_sudo_users:
  - name: soli
    github_user: soli0222
    login_authorized_keys: false
    sudo_authorized_keys: true
    lock_password: true
  - name: ubuntu
    github_user: soli0222
    login_authorized_keys: false
    sudo_authorized_keys: true

network_netplan:
  global:
    device: ens3
    ipv4: 133.18.141.63/23
    ipv6:
      - 2406:8c00:0:3464:133:18:141:63/64
    default_route:
      - 133.18.140.1
      - via: 2406:8c00:0:3464::1
        on-link: true
    nameservers:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    routes: []

  private:
    device: ens4
    ipv4:
      - 192.168.9.3/24
    ipv6:
      - fd00:192:168:9::3/64
    default_route: []
    nameservers: []
    routes: []

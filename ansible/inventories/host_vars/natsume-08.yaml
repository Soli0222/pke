---
ansible_host: natsume-08
cluster: natsume

alloy_systemd_units:
  - alloy.service
  - k3s-agent.service
  - falco-modern-bpf.service

# vda4（300G）を VG topolvm にする。vda5 は Longhorn の領域。
topolvm_storage_parent_disk: /dev/vda
topolvm_storage_partition_number: 4
topolvm_storage_partition_size_mib: 307200
topolvm_storage_partition_end: "100%"
topolvm_storage_devices:
  - /dev/vda4

network_netplan:
  global:
    device: ens3
    ipv4: 133.18.125.154/23
    ipv6:
      - 2406:8c00:0:3459:133:18:125:154/64
    default_route:
      - 133.18.124.1
      - via: 2406:8c00:0:3459::1
        on-link: true
    nameservers:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    routes: []

  private:
    device: ens4
    ipv4:
      - 192.168.9.8/24
    ipv6:
      - fd00:192:168:9::8/64
    default_route: []
    nameservers: []
    routes: []

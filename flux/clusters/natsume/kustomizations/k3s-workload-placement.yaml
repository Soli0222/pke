apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k3s-workload-placement
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/natsume/apps/k3s-workload-placement"
  # K3s の既存リソースを補完するため、登録解除時にも削除しない。
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry-valkey
  namespace: registry
spec:
  interval: 10m
  releaseName: registry-valkey
  targetNamespace: registry
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: valkey
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: valkey-repo-2
        namespace: registry
      interval: 1h
  values:
    # chart 1.0 の既定は Recreate。SSA 管理の既存 Deployment で切り替えると rollingUpdate が残って適用に失敗するため、現行の戦略を明示する。
    deploymentStrategy: RollingUpdate
    nodeSelector:
      kubernetes.io/hostname: natsume-03
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    initResources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

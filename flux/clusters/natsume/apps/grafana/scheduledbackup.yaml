apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-cluster-restored-weekly-backup
  namespace: grafana
spec:
  # 日曜 03:00 JST（土曜 18:00 UTC）
  schedule: "0 0 18 * * 6"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: grafana-cluster-restored
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

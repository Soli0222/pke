apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 10m
  releaseName: cnpg
  targetNamespace: cnpg-system
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg-repo
        namespace: cnpg-system
      interval: 1h
  values:
    config:
      data:
        # operator の更新で PostgreSQL の Pod を作り直さず、instance manager だけを差し替える。
        ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
    monitoring:
      podMonitorEnabled: true

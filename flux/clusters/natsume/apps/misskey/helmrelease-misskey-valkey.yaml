apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: misskey-valkey
  namespace: misskey
spec:
  interval: 10m
  releaseName: misskey-valkey
  targetNamespace: misskey
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey-repo
        namespace: misskey
      interval: 1h
  values:
    nodeSelector:
      kubernetes.io/hostname: natsume-08
    # RWO ボリュームをノード間で付け替えるため、旧 Pod の停止を待つ。
    deploymentStrategy: Recreate
    env:
      TZ: Asia/Tokyo
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    initResources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    replica:
      enabled: false
    dataStorage:
      enabled: true
      requestedSize: 10Gi
      className: ''
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

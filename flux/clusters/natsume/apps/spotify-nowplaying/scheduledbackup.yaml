apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: spn-cluster-weekly-backup
  namespace: spotify-nowplaying
spec:
  # 日曜 03:45 JST（土曜 18:45 UTC）
  schedule: "0 45 18 * * 6"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: spn-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

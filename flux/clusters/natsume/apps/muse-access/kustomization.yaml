apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../bases/muse-access
patches:
- target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: ClusterRole
    name: muse-observer
  patch: |-
    - op: add
      path: /rules/-
      value:
        apiGroups: [postgresql.cnpg.io]
        resources: [clusters, backups, scheduledbackups, poolers]
        verbs: [get, list, watch]

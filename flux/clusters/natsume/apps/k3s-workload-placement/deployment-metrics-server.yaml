# K3s の manifest と同じ nodeSelector を残す。kustomize-controller が所有しているため、
# 消すと SSA で live からも外れる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  selector:
    matchLabels:
      k8s-app: metrics-server
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      nodeSelector:
        kubernetes.io/os: linux

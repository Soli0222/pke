# K3s が管理する Deployment の配置だけを SSA で補完する。
# image・Corefile・Service・RBAC は K3s の管理を維持する。
# natsume は1ノードのため、CoreDNS は1 replica で podAntiAffinity を付けない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: kube-dns

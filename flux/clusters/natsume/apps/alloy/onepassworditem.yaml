apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: alertmanager-slack-webhook
  namespace: alloy
spec:
  itemPath: "vaults/Kubernetes/items/alertmanager-slack-webhook"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ntfy-alertmanager
  namespace: alloy
spec:
  # token field のみを持つ publish 専用 item。ntfy-admin の auth-tokens と同じ値。
  # Alloy は remote.kubernetes.secret で更新を取得するため再起動不要。
  itemPath: "vaults/Kubernetes/items/ntfy-alertmanager"

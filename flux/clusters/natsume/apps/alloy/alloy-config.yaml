apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: alloy
data:
  config.alloy: |
    // ============================================================
    // Endpoints
    // ============================================================

    loki.write "default" {
      endpoint {
        url = "http://loki.loki:3100/loki/api/v1/push"
        headers = {
          "X-Scope-OrgID" = "fake",
        }
      }
    }

    // external_labels の補完前に CNPG の DB 名を退避する。
    prometheus.relabel "cluster_labels" {
      forward_to = [prometheus.remote_write.default.receiver]

      rule {
        source_labels = ["__name__", "cluster"]
        regex         = "cnpg_.+;(.+)"
        target_label  = "cnpg_cluster"
        replacement   = "$1"
      }
      rule {
        target_label = "cluster"
        replacement  = "natsume"
      }
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "http://mimir.mimir:8080/api/v1/push"
        headers = {
          "X-Scope-OrgID" = "anonymous",
        }
      }

      external_labels = {
        cluster = "natsume",
      }
    }

    // ============================================================
    // OpenTelemetry: OTLP receiver for metrics, logs, and traces
    // ============================================================

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }

      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        metrics = [otelcol.processor.batch.otlp.input]
        logs    = [otelcol.processor.attributes.otlp_loki_labels.input]
        traces  = [otelcol.processor.batch.otlp.input]
      }
    }

    otelcol.processor.attributes "otlp_loki_labels" {
      action {
        key    = "loki.resource.labels"
        action = "insert"
        value  = "service.name, service.namespace"
      }

      output {
        logs = [otelcol.processor.batch.otlp.input]
      }
    }

    otelcol.processor.batch "otlp" {
      output {
        metrics = [otelcol.processor.deltatocumulative.otlp.input]
        logs    = [otelcol.exporter.loki.otlp.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.processor.deltatocumulative "otlp" {
      output {
        metrics = [otelcol.exporter.prometheus.otlp.input]
      }
    }

    otelcol.exporter.prometheus "otlp" {
      forward_to = [prometheus.relabel.cluster_labels.receiver]
    }

    otelcol.exporter.loki "otlp" {
      forward_to = [loki.process.otel_logs.receiver]
    }

    loki.process "otel_logs" {
      stage.static_labels {
        values = {
          cluster = "natsume",
          source  = "otlp",
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.tempo:4317"
        tls {
          insecure = true
        }
      }
    }

    // ============================================================
    // Mimir Rules & Alerts
    // ============================================================

    mimir.rules.kubernetes "default" {
      address = "http://mimir.mimir:8080"
      tenant_id = "anonymous"
      // namespace と入力系列・評価結果を natsume に統一する。
      mimir_namespace_prefix = "natsume"
      extra_query_matchers {
        matcher {
          name       = "cluster"
          match_type = "="
          value      = "natsume"
        }
      }
      external_labels = {
        cluster = "natsume",
      }
      rule_selector { match_labels = {} }
      rule_namespace_selector { match_labels = {} }
    }

    remote.kubernetes.secret "ntfy_publish" {
      namespace      = "alloy"
      name           = "ntfy-alertmanager"
      poll_frequency = "1m"
    }

    mimir.alerts.kubernetes "default" {
      address = "http://mimir.mimir:8080"
      http_headers = {
        "X-Scope-OrgID" = ["anonymous"],
      }
      global_config = `
        global:
          resolve_timeout: 5m
        route:
          receiver: ntfy_pke_default
          group_by:
          - cluster
          - alertname
          - namespace
          - severity
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
          - receiver: ntfy_natsume_default
            matchers:
            - cluster="natsume"
            routes:
            - receiver: ntfy_natsume_critical
              matchers:
              - severity="critical"
              repeat_interval: 1h
            - receiver: ntfy_natsume_warning
              matchers:
              - severity="warning"
              repeat_interval: 12h
          - receiver: ntfy_meruto_default
            matchers:
            - cluster="meruto"
            routes:
            - receiver: ntfy_meruto_critical
              matchers:
              - severity="critical"
              repeat_interval: 1h
            - receiver: ntfy_meruto_warning
              matchers:
              - severity="warning"
              repeat_interval: 12h
          - receiver: ntfy_pke_critical
            matchers:
            - severity="critical"
            repeat_interval: 1h
          - receiver: ntfy_pke_warning
            matchers:
            - severity="warning"
            repeat_interval: 12h
        inhibit_rules:
        - source_matchers:
          - alertname="KubePersistentVolumeSpaceCritical"
          - severity="critical"
          - cluster=~".+"
          - namespace=~".+"
          - persistentvolumeclaim=~".+"
          target_matchers:
          - alertname="KubePersistentVolumeSpaceLow"
          - severity="warning"
          - cluster=~".+"
          - namespace=~".+"
          - persistentvolumeclaim=~".+"
          equal:
          - cluster
          - namespace
          - persistentvolumeclaim
        - source_matchers:
          - alertname="HostFilesystemSpaceCritical"
          - severity="critical"
          - cluster=~".+"
          - instance=~".+"
          - mountpoint=~".+"
          - device=~".+"
          target_matchers:
          - alertname="HostFilesystemSpaceLow"
          - severity="warning"
          - cluster=~".+"
          - instance=~".+"
          - mountpoint=~".+"
          - device=~".+"
          equal:
          - cluster
          - instance
          - mountpoint
          - device
        - source_matchers:
          - alertname="LonghornNodeSpaceCritical"
          - severity="critical"
          - cluster=~".+"
          - node=~".+"
          target_matchers:
          - alertname="LonghornNodeSpaceLow"
          - severity="warning"
          - cluster=~".+"
          - node=~".+"
          equal:
          - cluster
          - node
        - source_matchers:
          - alertname="LonghornDiskSpaceCritical"
          - severity="critical"
          - cluster=~".+"
          - node=~".+"
          - disk=~".+"
          target_matchers:
          - alertname="LonghornDiskSpaceLow"
          - severity="warning"
          - cluster=~".+"
          - node=~".+"
          - disk=~".+"
          equal:
          - cluster
          - node
          - disk
        - source_matchers:
          - alertname="CertExpiryCritical"
          - severity="critical"
          - cluster=~".+"
          - namespace=~".+"
          - name=~".+"
          target_matchers:
          - alertname="CertExpiringSoon"
          - severity="warning"
          - cluster=~".+"
          - namespace=~".+"
          - name=~".+"
          equal:
          - cluster
          - namespace
          - name
        - source_matchers:
          - alertname="SSLCertExpiryCritical"
          - severity="critical"
          - cluster=~".+"
          - namespace=~".+"
          - job=~".+"
          - instance=~".+"
          target_matchers:
          - alertname="SSLCertExpiringSoon"
          - severity="warning"
          - cluster=~".+"
          - namespace=~".+"
          - job=~".+"
          - instance=~".+"
          equal:
          - cluster
          - namespace
          - job
          - instance
        - source_matchers:
          - alertname="EndpointDown"
          - severity="critical"
          - cluster=~".+"
          - namespace=~".+"
          - job=~".+"
          - instance=~".+"
          - job="http-get"
          target_matchers:
          - alertname="HTTPStatusCodeError"
          - severity="warning"
          - cluster=~".+"
          - namespace=~".+"
          - job=~".+"
          - instance=~".+"
          - job="http-get"
          equal:
          - cluster
          - namespace
          - job
          - instance
        receivers:
        - name: ntfy_natsume_critical
          webhook_configs:
          - url: https://ntfy.pstr.space/natsume-alerts?template=alertmanager&tags=rotating_light
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_natsume_warning
          webhook_configs:
          - url: https://ntfy.pstr.space/natsume-alerts?template=alertmanager&tags=warning
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_natsume_default
          webhook_configs:
          - url: https://ntfy.pstr.space/natsume-alerts?template=alertmanager&tags=information_source
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_meruto_critical
          webhook_configs:
          - url: https://ntfy.pstr.space/meruto-alerts?template=alertmanager&tags=rotating_light
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_meruto_warning
          webhook_configs:
          - url: https://ntfy.pstr.space/meruto-alerts?template=alertmanager&tags=warning
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_meruto_default
          webhook_configs:
          - url: https://ntfy.pstr.space/meruto-alerts?template=alertmanager&tags=information_source
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_pke_critical
          webhook_configs:
          - url: https://ntfy.pstr.space/pke-alerts?template=alertmanager&tags=rotating_light
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_pke_warning
          webhook_configs:
          - url: https://ntfy.pstr.space/pke-alerts?template=alertmanager&tags=warning
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        - name: ntfy_pke_default
          webhook_configs:
          - url: https://ntfy.pstr.space/pke-alerts?template=alertmanager&tags=information_source
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: ` + remote.kubernetes.secret.ntfy_publish.data["token"] + `
        `
      alertmanagerconfig_selector { match_labels = {} }
      alertmanagerconfig_namespace_selector { match_labels = {} }
    }

    // ============================================================
    // Discovery
    // ============================================================

    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.kubernetes "api_endpoints" {
      role = "endpoints"
    }

    // ============================================================
    // Metrics: Kubernetes API Server
    // ============================================================

    discovery.relabel "kubernetes_api" {
      targets = discovery.kubernetes.api_endpoints.targets

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_service_name", "__meta_kubernetes_namespace"]
        separator     = ";"
        regex         = "kubernetes;default"
      }
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_endpoint_port_name"]
        regex         = "https"
      }
    }

    prometheus.scrape "kubernetes_api" {
      targets         = discovery.relabel.kubernetes_api.output
      forward_to      = [prometheus.relabel.cluster_labels.receiver]
      scrape_interval = "30s"
      metrics_path    = "/metrics"
      clustering { enabled = true }
    }

    // ============================================================
    // Metrics: Kubelet & cAdvisor
    // ============================================================

    discovery.relabel "kubelet_targets" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        regex         = "(.+)"
        replacement   = "$1:10250"
      }
      // node label = node name (for joining with pod metrics)
      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      // instance = node name (human-readable)
      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }
    }

    prometheus.scrape "kubernetes_nodes" {
      targets         = discovery.relabel.kubelet_targets.output
      forward_to      = [prometheus.relabel.cluster_labels.receiver]
      scrape_interval = "30s"
      metrics_path    = "/metrics"
      scheme          = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
      clustering { enabled = true }
    }

    prometheus.scrape "kubernetes_cadvisor" {
      targets         = discovery.relabel.kubelet_targets.output
      forward_to      = [prometheus.relabel.cluster_labels.receiver]
      scrape_interval = "30s"
      metrics_path    = "/metrics/cadvisor"
      scheme          = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
      clustering { enabled = true }
    }

    // ============================================================
    // Metrics: Operator CRDs (ServiceMonitor / PodMonitor / Probe)
    // ============================================================

    prometheus.operator.servicemonitors "default" {
      forward_to = [prometheus.relabel.cluster_labels.receiver]
      clustering { enabled = true }
    }

    prometheus.operator.podmonitors "default" {
      forward_to = [prometheus.relabel.cluster_labels.receiver]
      clustering { enabled = true }
    }

    prometheus.operator.probes "default" {
      forward_to = [prometheus.relabel.cluster_labels.receiver]
      clustering { enabled = true }
    }

    // ============================================================
    // Metrics: Alloy self-monitoring
    // ============================================================

    prometheus.scrape "alloy_metrics" {
      targets         = [{"__address__" = "localhost:12345"}]
      forward_to      = [prometheus.relabel.cluster_labels.receiver]
      scrape_interval = "15s"
      metrics_path    = "/metrics"
      clustering { enabled = true }
    }

    // ============================================================
    // Logs: Pod logs with node label
    // ============================================================

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      // Add node name to pod logs
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_id"]
        target_label  = "container_runtime"
        regex         = "^(\\S+):\\/\\/.+$"
        replacement   = "$1"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = ";"
        regex         = "([^;]+);([^;]+);([^;]+);([^;]+)"
        replacement   = "/var/log/pods/$1_$2_$3/$4/*.log"
        target_label  = "__path__"
      }
    }

    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
      clustering { enabled = true }
    }

    loki.process "pod_logs" {
      stage.static_labels {
        values = {
          cluster = "natsume",
        }
      }
      forward_to = [loki.write.default.receiver]
    }

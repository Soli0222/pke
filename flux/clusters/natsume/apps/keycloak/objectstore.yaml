apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: keycloak-backup-store
  namespace: keycloak
spec:
  retentionPolicy: 7d
  configuration:
    # 初期 DB のアーカイブと分離し、空の DB から再構築できる保存先にする。
    destinationPath: s3://cnpg-backup/keycloak/
    endpointURL: ${CNPG_BACKUP_ENDPOINT_URL}
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip

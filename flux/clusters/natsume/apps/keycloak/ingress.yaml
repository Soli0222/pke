apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: traefik
  tls:
  - secretName: keycloak.pstr.space-http01
    hosts: [keycloak.pstr.space]
  rules:
  - host: keycloak.pstr.space
    http:
      # /admin と /realms/master は公開しない。CIMD を使い、匿名 DCR は公開しない。
      paths:
      - path: /realms/sui/.well-known/
        pathType: Prefix
        backend: &keycloak
          service:
            name: keycloak
            port:
              name: http
      - path: /realms/sui/protocol/openid-connect/
        pathType: Prefix
        backend: *keycloak
      - path: /realms/sui/login-actions/
        pathType: Prefix
        backend: *keycloak
      - path: /realms/sui/account/
        pathType: Prefix
        backend: *keycloak
      - path: /resources/
        pathType: Prefix
        backend: *keycloak
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    traefik.ingress.kubernetes.io/router.tls.options: cert-manager-pke-natsume-mtls@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - secretName: admin.keycloak.pstr.space-http01
    hosts: [admin.keycloak.pstr.space]
  rules:
  - host: admin.keycloak.pstr.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              name: http

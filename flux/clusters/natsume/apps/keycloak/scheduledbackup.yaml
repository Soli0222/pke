apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-cluster-weekly-backup
  namespace: keycloak
spec:
  # 日曜 04:15 JST（土曜 19:15 UTC）
  schedule: "0 15 19 * * 6"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

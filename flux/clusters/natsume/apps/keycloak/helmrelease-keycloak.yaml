apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 10m
  timeout: 10m
  releaseName: keycloak
  targetNamespace: keycloak
  install:
    createNamespace: false
  chart:
    spec:
      chart: keycloakx
      version: 7.4.0
      sourceRef:
        kind: HelmRepository
        name: keycloak-repo
        namespace: keycloak
      interval: 1h
  values:
    nameOverride: keycloak
    fullnameOverride: keycloak
    # StatefulSet の単一 Pod を順に置き換え、DB schema 更新時に旧版を並行稼働させない。
    replicas: 1
    updateStrategy: RollingUpdate
    image:
      repository: quay.io/keycloak/keycloak
      tag: "26.8.1"
    args: [start]
    serviceAccount:
      automountServiceAccountToken: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    database:
      vendor: postgres
      hostname: keycloak-cluster-rw
      port: 5432
      database: keycloak
      existingSecret: keycloak-cluster-app
      existingSecretKey: password
    proxy:
      enabled: true
      mode: xforwarded
      http:
        enabled: true
    http:
      relativePath: /
      managementRelativePath: /
      internalPort: management
      internalScheme: HTTP
    health:
      enabled: true
    metrics:
      enabled: true
    extraEnv: |
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-cluster-app
            key: username
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-bootstrap
            key: username
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-bootstrap
            key: password
      - name: KC_HOSTNAME
        # Terraform 未適用の master realm も管理ホスト内で認証を完結させる。
        # 公開する pke realm の frontendUrl は Terraform で別途設定する。
        value: https://admin.keycloak.pstr.space
      - name: KC_HOSTNAME_ADMIN
        value: https://admin.keycloak.pstr.space
      - name: KC_FEATURES
        value: cimd,resource-indicators
      - name: KC_HTTP_MANAGEMENT_SCHEME
        value: http
      - name: KC_LOG_CONSOLE_OUTPUT
        value: json
      # DCR の拒否 URI と検証理由を記録する一時診断。原因特定後はこの設定を削除する。
      - name: KC_LOG_LEVEL
        value: INFO,org.keycloak.services.clientpolicy.executor.SecureRedirectUrisEnforcerExecutor:DEBUG
    startupProbe: |
      httpGet:
        path: /health/started
        port: management
      periodSeconds: 5
      failureThreshold: 120
    readinessProbe: |
      httpGet:
        path: /health/ready
        port: management
      periodSeconds: 10
    livenessProbe: |
      httpGet:
        path: /health/live
        port: management
      periodSeconds: 10
    service:
      httpPort: 8080
      httpsPort: null
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-http01
      rules:
        - host: keycloak.pstr.space
          # /admin と /realms/master は公開しない。DCR は専用 Ingress で制限する。
          paths:
            # RFC 8414: issuer のパスより前に well-known を挿入する探索順序にも対応。
            # /.well-known 全体を公開せず、pke の認可サーバー metadata だけに限定する。
            - path: /.well-known/oauth-authorization-server/realms/pke
              pathType: Exact
            - path: /realms/pke/.well-known/
              pathType: Prefix
            - path: /realms/pke/protocol/openid-connect/
              pathType: Prefix
            - path: /realms/pke/login-actions/
              pathType: Prefix
            - path: /realms/pke/account/
              pathType: Prefix
            - path: /resources/
              pathType: Prefix
      tls:
        - secretName: keycloak.pstr.space-http01
          hosts: [keycloak.pstr.space]
      console:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-http01
          traefik.ingress.kubernetes.io/router.tls.options: cert-manager-pke-natsume-mtls@kubernetescrd
        rules:
          - host: admin.keycloak.pstr.space
            # 管理 UI に加え、master realm のログインも mTLS 内で提供する。
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: admin.keycloak.pstr.space-http01
            hosts: [admin.keycloak.pstr.space]
    serviceMonitor:
      enabled: true
      port: management
      path: /metrics
    # ポート別に Traefik / Alloy の接続元を分離するため networkpolicy.yaml で管理。
    networkPolicy:
      enabled: false
    # Terraform の DCR ポリシー適用後に公開する。通常のログインとレート制限を分離する。
    # chart が公開用 Ingress を1つだけ生成するため、DCR 用は extraManifests で Helm 管理する。
    extraManifests:
      - |
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: {{ include "keycloak.fullname" . }}-dcr-ratelimit
          namespace: {{ .Release.Namespace }}
        spec:
          rateLimit:
            average: 10
            period: 1m
            burst: 5
            # 同じ公開ホストへの要求をまとめる。送信元 IP の分散で制限を回避させない。
            # カウンターは Traefik インスタンスごと。realm 全体の登録数は Keycloak でも制限する。
            sourceCriterion:
              requestHost: true
      - |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: {{ include "keycloak.fullname" . }}-dcr
          namespace: {{ .Release.Namespace }}
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-{{ include "keycloak.fullname" . }}-dcr-ratelimit@kubernetescrd'
        spec:
          ingressClassName: traefik
          tls:
            # 通常の公開 Ingress が管理する既存証明書を共用する。
            - secretName: keycloak.pstr.space-http01
              hosts: [keycloak.pstr.space]
          rules:
            - host: keycloak.pstr.space
              http:
                paths:
                  # 登録と Registration Access Token による個別クライアント管理だけを公開。
                  # default / install / saml2-entity-descriptor は含めない。
                  - path: /realms/pke/clients-registrations/openid-connect
                    pathType: Prefix
                    backend:
                      service:
                        name: {{ include "keycloak.fullname" . }}-http
                        port:
                          name: http

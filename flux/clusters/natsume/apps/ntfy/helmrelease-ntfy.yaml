apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: ntfy
spec:
  interval: 10m
  releaseName: ntfy
  targetNamespace: ntfy
  install:
    createNamespace: false
  chart:
    spec:
      chart: ./charts/ntfy
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  values:
    env:
      - name: NTFY_AUTH_USERS
        valueFrom:
          secretKeyRef:
            name: ntfy-admin
            key: auth-users
      - name: NTFY_AUTH_TOKENS
        valueFrom:
          secretKeyRef:
            name: ntfy-admin
            key: auth-tokens

    ntfy:
      # 同名の組み込み template を上書きする。更新前後とも従来 URL で受信できる。
      templates:
        alertmanager: |
          title: >-
            {{ if eq .status "resolved" }}Resolved{{ else }}Firing{{ end }}: {{ .commonLabels.cluster | default "pke" }} / {{ .commonLabels.alertname }}
          priority: >-
            {{ if eq .status "resolved" }}2{{ else if eq .commonLabels.severity "critical" }}5{{ else if eq .commonLabels.severity "warning" }}3{{ else }}2{{ end }}
          message: |
            Status: {{ .status }}
            {{ range .alerts }}
            {{ .annotations.summary }}
            {{ .annotations.description }}
            {{ if .annotations.panel_url }}Grafana: {{ .annotations.panel_url }}{{ else if .annotations.dashboard_url }}Grafana: {{ .annotations.dashboard_url }}{{ end }}
            {{ if .annotations.runbook_url }}Runbook: {{ .annotations.runbook_url }}{{ end }}
            {{ end }}
      config: |
        template-dir: "/etc/ntfy/templates"
        base-url: "https://ntfy.pstr.space"
        listen-http: ":{{ .Values.service.port }}"
        metrics-listen-http: ":{{ .Values.service.metricsPort }}"
        behind-proxy: true

        cache-file: "/var/cache/ntfy/cache.db"
        auth-file: "/var/cache/ntfy/user.db"
        auth-default-access: "deny-all"
        auth-access:
          - "alertmanager:natsume-alerts:write-only"
          - "alertmanager:meruto-alerts:write-only"
          - "alertmanager:pke-alerts:write-only"
        enable-login: true
        enable-signup: false
        require-login: true

        attachment-cache-dir: "/var/cache/ntfy/attachments"
        attachment-total-size-limit: "5G"
        attachment-file-size-limit: "15M"

        upstream-base-url: "https://ntfy.sh"

    persistence:
      storageClass: longhorn
      size: 10Gi

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-http01
      hosts:
        - host: ntfy.pstr.space
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - ntfy.pstr.space
          secretName: ntfy.pstr.space-http01

    serviceMonitor:
      enabled: true

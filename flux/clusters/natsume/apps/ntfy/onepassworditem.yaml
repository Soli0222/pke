apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ntfy-admin
  namespace: ntfy
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  # auth-users: 既存 admin を保持し alertmanager (role=user) を追加。
  # auth-tokens: alertmanager:<publish token>。既存の宣言的 token も保持する。
  # 準備・反映順序は MONITORING.md を参照。
  itemPath: vaults/Kubernetes/items/ntfy-admin

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  annotations:
    cnpg.io/operatorVersion: 1.29.0
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: ntfy-cluster
    app.kubernetes.io/managed-by: cloudnative-pg
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: "18"
    cnpg.io/cluster: ntfy-cluster
  name: ntfy-cluster
  namespace: ntfy
spec:
  podMetricsEndpoints:
  - port: metrics
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
      targetLabel: cnpg_cluster
  selector:
    matchLabels:
      cnpg.io/cluster: ntfy-cluster
      cnpg.io/podRole: instance

apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ntfy-cluster-weekly-backup
  namespace: ntfy
spec:
  # 日曜 04:00 JST（土曜 19:00 UTC）
  schedule: "0 0 19 * * 6"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: ntfy-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

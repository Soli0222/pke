apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring-rules
  namespace: monitoring-rules
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/monitoring-rules
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  values:
    # BEGIN generated monitoring inventory (scripts/sync-monitoring-inventory.py)
    hosts:
    - name: natsume-03
      units:
      - alloy.service
      - k3s.service
      - etcd.service
      - falco-modern-bpf.service
      networkDevices:
      - ens3
      - ens7
    - name: natsume-08
      units:
      - alloy.service
      - k3s-agent.service
      - falco-modern-bpf.service
      networkDevices:
      - ens3
      - ens7
    databases:
    - namespace: grafana
      name: grafana-cluster
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    - namespace: misskey
      name: misskey-cluster
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 108000
    - namespace: spotify-nowplaying
      name: spn-cluster
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    - namespace: spotify-reblend
      name: reblend-cluster
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    - namespace: sui
      name: sui-cluster
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    # END generated monitoring inventory

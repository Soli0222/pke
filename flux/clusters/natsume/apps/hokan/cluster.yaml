apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hokan-db
  namespace: hokan
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 0
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: hokan-backup-store
  storage:
    storageClass: topolvm
    size: 5Gi
    resizeInUseVolumes: false
  bootstrap:
    initdb:
      database: hokan
      owner: hokan

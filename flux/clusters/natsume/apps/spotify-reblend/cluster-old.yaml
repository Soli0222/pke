# 移行前の Cluster。reblend-db の切り替えを確認した後、PVC とあわせて削除する。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: reblend-cluster-restored
  namespace: spotify-reblend
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 60
  affinity:
    nodeSelector:
      kubernetes.io/hostname: natsume-08
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: reblend-backup-store
  storage:
    storageClass: topolvm
    size: 5Gi
    resizeInUseVolumes: false
  bootstrap:
    recovery:
      source: origin
      database: reblend
      owner: reblend
      recoveryTarget:
        backupID: 20261003T183000
  externalClusters:
  - name: origin
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: reblend-backup-store-restore
        serverName: reblend-cluster
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  annotations:
    cnpg.io/operatorVersion: 1.29.0
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: reblend-cluster-restored
    app.kubernetes.io/managed-by: cloudnative-pg
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/version: "18"
    cnpg.io/cluster: reblend-cluster-restored
  name: reblend-cluster-restored
  namespace: spotify-reblend
spec:
  podMetricsEndpoints:
  - port: metrics
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
      targetLabel: cnpg_cluster
  selector:
    matchLabels:
      cnpg.io/cluster: reblend-cluster-restored
      cnpg.io/podRole: instance

apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sui-cluster-restored-weekly-backup
  namespace: sui
spec:
  # 日曜 03:15 JST（土曜 18:15 UTC）
  schedule: "0 15 18 * * 6"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: sui-cluster-restored
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

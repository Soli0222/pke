apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sui
  namespace: sui
spec:
  interval: 10m
  releaseName: sui
  targetNamespace: sui
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: sui
      version: 0.3.3
      sourceRef:
        kind: HelmRepository
        name: sui-repo
        namespace: sui
      interval: 1h
  values:
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-http01
      hosts:
      - host: sui.str08.net
        paths:
        - path: "/"
          pathType: Prefix
      tls:
      - secretName: sui.str08.net-http01
        hosts:
        - sui.str08.net
    auth:
      oidc:
        issuer: "https://auth0.pstr.space"
        clientIdSecret:
          existingSecret: "sui-oidc"
          existingSecretKey: clientId
        redirectUri: "https://sui.str08.net/api/auth/callback"
        allowedEmails:
          - "sui@str08.net"
      cookieSecure: "true"
    tracing:
      tracesEndpoint: "http://alloy-otlp.alloy.svc.cluster.local:4318/v1/traces"
    postgresql:
      enabled: false
    externalPostgres:
      host: sui-cluster-rw
      port: 5432
      database: sui
      user: sui
      existingSecret: sui-cluster-app
      existingSecretKey: password

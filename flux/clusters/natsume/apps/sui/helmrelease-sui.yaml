apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sui
  namespace: sui
spec:
  interval: 10m
  releaseName: sui
  targetNamespace: sui
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: sui
      version: 0.9.4
      sourceRef:
        kind: HelmRepository
        name: sui-repo
        namespace: sui
      interval: 1h
  # Terraform の出力を同期して初めて切り替える。Secret 未作成時は旧 release が稼働を続ける。
  valuesFrom:
  - kind: Secret
    name: sui-keycloak
    valuesKey: values.yaml
    optional: false
  values:
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-http01
      hosts:
      - host: sui.str08.net
        paths:
        - path: "/"
          pathType: Prefix
      tls:
      - secretName: sui.str08.net-http01
        hosts:
        - sui.str08.net
    auth:
      oidc:
        issuer: "https://keycloak.pstr.space/realms/pke"
        clientId: "sui-web"
        redirectUri: "https://sui.str08.net/api/auth/callback"
        # allowedSubjects と image.tag は sui-keycloak/values.yaml から取得。
        allowedEmails: []
      cookieSecure: "true"
    mcp:
      maxSessionsPerToken: "50"
      oauth:
        resourceUrl: "https://sui.str08.net/mcp"
    credentials:
      encryptionKey:
        existingSecret: sui-credentials
        existingSecretKey: SUI_CREDENTIAL_ENCRYPTION_KEY
    tracing:
      tracesEndpoint: "http://alloy-otlp.alloy.svc.cluster.local:4318/v1/traces"
    postgresql:
      enabled: false
    externalPostgres:
      host: sui-cluster-restored-rw
      port: 5432
      database: sui
      user: sui
      existingSecret: sui-cluster-restored-app
      existingSecretKey: password

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ccat-snmp-exporter
  namespace: ccat-snmp-exporter
spec:
  interval: 10m
  releaseName: ccat-snmp-exporter
  targetNamespace: ccat-snmp-exporter
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: 9.18.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repo
        namespace: ccat-snmp-exporter
      interval: 1h
  values:
    # 標準モジュールは固定バージョンのイメージから読み込む。
    config: |
      modules:
        ccat_system:
          get:
          - 1.3.6.1.2.1.1.3.0
          metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
            help: Time since the network management subsystem was initialized (hundredths of a second).
    extraArgs:
    - "--config.file=/etc/snmp_exporter/snmp.yml"
    - "--config.file=/run/secrets/snmp-exporter/auth.yaml"
    extraSecretMounts:
    - name: snmp-config
      mountPath: /run/secrets/snmp-exporter
      secretName: snmp-exporter-config
      readOnly: true
      defaultMode: 420
    serviceMonitor:
      enabled: true
      path: /snmp
      scrapeTimeout: 30s
      module:
      - if_mib
      - cisco_device
      - ccat_system
      auth:
      - ccat_v2
      honorLabels: true
      params:
      - name: ccat-1
        target: 192.168.10.254
        module:
        - if_mib
        - cisco_device
        - ccat_system
        auth:
        - ccat_v2
        interval: 60s
        scrapeTimeout: 30s
        relabelings:
        - targetLabel: instance
          replacement: 192.168.10.254
        - targetLabel: target
          replacement: ccat-1
      selfMonitor:
        enabled: true
        port: http
        interval: 60s

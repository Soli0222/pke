# NAS の共有 share には音楽以外のファイルもあるため、音楽のディレクトリだけを source ごとに
# 読み取り専用でマウントする。選別アプリがここから選んだアルバムを navidrome-music にコピーする。
# Navidrome は直接読まない。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-nas-share-music
spec:
  capacity:
    storage: 1Ti
  accessModes:
  - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: navidrome
    name: nas-share-music
  mountOptions:
  - ro
  - uid=1000
  - gid=1000
  - dir_mode=0555
  - file_mode=0444
  # NAS 側でフォルダのファイル ID が変わると、serverino ではルートが ESTALE のままになり、
  # Pod を作り直すまで読めない。inode 番号は使わないので、サーバーの ID と照合しない。
  - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: true
    # クラスタ内で一意であればよい。
    volumeHandle: 192.168.40.2/share/Music#navidrome-nas-share-music
    volumeAttributes:
      source: //192.168.40.2/share/Music
    nodeStageSecretRef:
      name: navidrome-nas-smb
      namespace: navidrome
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-share-music
  namespace: navidrome
spec:
  accessModes:
  - ReadOnlyMany
  storageClassName: ""
  volumeName: navidrome-nas-share-music
  resources:
    requests:
      storage: 1Ti
---

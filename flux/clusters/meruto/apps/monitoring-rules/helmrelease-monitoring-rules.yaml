apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring-rules
  namespace: monitoring-rules
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/monitoring-rules
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  values:
    # BEGIN generated monitoring inventory (scripts/sync-monitoring-inventory.py)
    hosts:
    - name: lune-02
      units:
      - alloy.service
      - falco-modern-bpf.service
      - haproxy.service
      - nftables.service
      - wg-quick@wg0.service
      - pke-wireguard-metrics.timer
      - tailscaled.service
      networkDevices:
      - ens3
    - name: meruto-02
      units:
      - alloy.service
      - k3s.service
      - etcd.service
      - falco-modern-bpf.service
      - wg-quick@wg0.service
      - pke-wireguard-metrics.timer
      networkDevices:
      - enp3s0
    databases:
    - namespace: grafana
      name: grafana-db
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    - namespace: keycloak
      name: keycloak-db
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    - namespace: ntfy
      name: ntfy-db
      archive: true
      replication: false
      baseBackupMaxAgeSeconds: 648000
    containerlessHosts:
    - lune-02
    # END generated monitoring inventory
    groups:
      longhorn:
        enabled: false

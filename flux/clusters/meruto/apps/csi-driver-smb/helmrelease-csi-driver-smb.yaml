# NAS（192.168.40.2）の SMB 共有を静的 PV としてマウントする。動的プロビジョニングは使わない。
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: csi-driver-smb
spec:
  interval: 10m
  releaseName: csi-driver-smb
  targetNamespace: csi-driver-smb
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: csi-driver-smb
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb-repo
        namespace: csi-driver-smb
      interval: 1h
  values:
    controller:
      logLevel: 2
    node:
      logLevel: 2
    windows:
      enabled: false

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mf-account-reloader
  namespace: mf-account-reloader
spec:
  interval: 10m
  releaseName: mf-account-reloader
  targetNamespace: mf-account-reloader
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: mf-account-reloader
      version: 0.2.1
      sourceRef:
        kind: HelmRepository
        name: mf-account-reloader-repo
        namespace: mf-account-reloader
      interval: 1h
  values:
    schedule: "0 11 * * *"
    timeZone: Asia/Tokyo
    auth:
      stateSecret:
        name: mfr-auth-state
        key: auth-state.json
    config:
      reload:
        extraAccountNames:
        - "モバイルSuica（JRE ID）"
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

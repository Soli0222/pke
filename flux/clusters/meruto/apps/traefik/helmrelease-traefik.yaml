apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  releaseName: traefik
  targetNamespace: traefik
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
        namespace: traefik
      interval: 1h
  values:
    deployment:
      kind: DaemonSet
    log:
      format: json
    accessLog:
      enabled: true
      format: json
    metrics:
      addInternals: true
      prometheus:
        serviceMonitor:
          enabled: true
    service:
      spec:
        externalTrafficPolicy: Local
    # lune-02 の HAProxy が wg0 経由で PROXY protocol v2 を付けて転送する。
    # 送信元が lune-02 の WireGuard アドレスのときだけヘッダを信頼する。
    ports:
      web:
        proxyProtocol:
          trustedIPs:
          - 10.99.0.1/32
      websecure:
        proxyProtocol:
          trustedIPs:
          - 10.99.0.1/32
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
    providers:
      kubernetesCRD:
        ingressClass: traefik
      kubernetesIngress:
        ingressClass: traefik
        # Service の status はノードの LAN アドレスになるため使わない。
        # Ingress の status を meruto.pstr.space にし、external-dns に CNAME を作らせる。
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: meruto.pstr.space

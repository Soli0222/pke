apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  releaseName: metallb
  targetNamespace: metallb-system
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb-repo
        namespace: metallb-system
      interval: 1h
  values:
    # 単一ノードで L2 の広告だけを使う。BGP（frr-k8s）と memberlist（7946）は使わない。
    frrk8s:
      enabled: false
    speaker:
      memberlist:
        enabled: false
      frr:
        enabled: false
    # speaker のメトリクスは METALLB_HOST（ノードの InternalIP）で待ち受ける。
    prometheus:
      rbacPrometheus: false
      serviceMonitor:
        enabled: true

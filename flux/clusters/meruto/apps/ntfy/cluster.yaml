apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ntfy-db
  namespace: ntfy
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 60
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: ntfy-backup-store
  storage:
    storageClass: topolvm
    size: 5Gi
    resizeInUseVolumes: false
  bootstrap:
    recovery:
      source: origin
      database: ntfy
      owner: ntfy
  externalClusters:
  - name: origin
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: ntfy-backup-store-restore
        serverName: ntfy-cluster

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-probes
  namespace: blackbox-exporter-probes
spec:
  interval: 10m
  releaseName: blackbox-exporter-probes
  targetNamespace: blackbox-exporter-probes
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: ./charts/blackbox-exporter-probes
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  values:
    applications:
    - name: misskey-polestar
      targets:
      - https://mi.soli0222.com
      - https://summaly.soli0222.com/health
    - name: spotify-nowplaying
      targets:
      - https://spn.soli0222.com/status
    - name: navidrome
      targets:
      - https://navidrome.pstr.space
    prometheusRule:
      endpointDown:
        annotations:
          dashboard_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now'
          panel_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now&viewPanel=2'
      sslCertExpiry:
        annotations:
          dashboard_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now'
          panel_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now&viewPanel=2'
      sslCertExpiryCritical:
        annotations:
          dashboard_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now'
          panel_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now&viewPanel=2'
      slowResponse:
        annotations:
          dashboard_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now'
          panel_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now&viewPanel=2'
      httpStatusError:
        annotations:
          dashboard_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now'
          panel_url: 'https://grafana.str08.net/d/NEzutrbMk?var-cluster={{ $labels.cluster | urlquery }}&var-job=%24__all&var-instance={{ $labels.instance | urlquery }}&from=now-6h&to=now&viewPanel=2'

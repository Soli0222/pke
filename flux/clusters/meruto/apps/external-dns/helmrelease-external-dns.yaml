apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 10m
  releaseName: external-dns
  targetNamespace: external-dns
  install:
    createNamespace: false
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: external-dns
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-repo
        namespace: external-dns
      interval: 1h
  values:
    env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: apiToken
    # traefik は lune-02 の v4 / v6、traefik-local は LAN の 192.168.50.201 を Ingress の status に書く。
    extraArgs:
      ingress-class:
      - traefik
      - traefik-local
    managedRecordTypes:
    - A
    - AAAA
    - CNAME
    # - TXT
    sources:
    - service
    - ingress
    - crd
    - traefik-proxy
    domainFilters:
    - str08.net
    - soli0222.com
    - pstr.space
    policy: sync
    txtPrefix: meruto-
    provider:
      name: cloudflare
    serviceMonitor:
      enabled: true

# meruto の Ingress は lune-02 の HAProxy から WireGuard で受ける。
# 各 Ingress のレコードは Traefik の Service の status（lune-02 の v4 / v6）から作られる。
# ここでは natsume.pstr.space と同じく、クラスタの入口を表す名前を登録する。
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: meruto-ingress-records
  namespace: external-dns
spec:
  endpoints:
  - dnsName: meruto.pstr.space
    recordType: A
    targets:
    - 133.18.187.207
  - dnsName: meruto.pstr.space
    recordType: AAAA
    targets:
    - 2406:8c00:0:3476:133:18:187:207

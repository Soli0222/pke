apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cdi
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/meruto/apps/cdi"
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: cdi-operator
  # CDI の CR は Ready condition を持たず、phase と Available condition で完了を表す。
  healthCheckExprs:
  - apiVersion: cdi.kubevirt.io/v1beta1
    kind: CDI
    failed: status.conditions.exists(e, e.type == 'Degraded' && e.status == 'True')
    current: status.phase == 'Deployed' && status.conditions.exists(e, e.type == 'Available' && e.status == 'True')

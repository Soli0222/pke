apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mf-account-reloader-auth
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/meruto/apps/mf-account-reloader/auth"
  prune: true
  wait: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: v1
    kind: Secret
    name: mfr-auth-state
    namespace: mf-account-reloader

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: navidrome-curator
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/meruto/apps/navidrome-curator"
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: navidrome-storage
  - name: prometheus-operator-crd
  - name: traefik-local
  - name: cert-manager-config

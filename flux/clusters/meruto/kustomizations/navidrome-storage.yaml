# Navidrome の PVC と NAS の PV。誤って消すとデータを失うため prune しない。
# 不要になったら手で消す。
# navidrome-music / navidrome-data は使う Pod ができるまで Pending なので wait しない。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: navidrome-storage
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/meruto/apps/navidrome-storage"
  prune: false
  wait: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: csi-driver-smb
  - name: topolvm
  healthChecks:
  - apiVersion: v1
    kind: Secret
    name: navidrome-nas-smb
    namespace: navidrome
  - apiVersion: v1
    kind: PersistentVolumeClaim
    name: nas-music
    namespace: navidrome

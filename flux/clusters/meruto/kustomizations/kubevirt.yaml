apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/meruto/apps/kubevirt"
  prune: true
  wait: true
  # virt-api / virt-controller / virt-handler の image pull を待つ。
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: kubevirt-operator
  # KubeVirt の CR は Ready condition を持たず、phase と Available condition で完了を表す。
  healthCheckExprs:
  - apiVersion: kubevirt.io/v1
    kind: KubeVirt
    failed: status.conditions.exists(e, e.type == 'Degraded' && e.status == 'True')
    current: status.phase == 'Deployed' && status.conditions.exists(e, e.type == 'Available' && e.status == 'True')

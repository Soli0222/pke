apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mf-account-reloader
  namespace: flux-system
spec:
  interval: 10m
  path: "./flux/clusters/meruto/apps/mf-account-reloader"
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: mf-account-reloader-auth
  - name: longhorn

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: muse-observer
rules:
- apiGroups: [""]
  resources: [pods, services, endpoints, events, namespaces, nodes, persistentvolumeclaims, persistentvolumes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets, daemonsets, controllerrevisions]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, ingressclasses, networkpolicies]
  verbs: [get, list, watch]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses, volumeattachments, csidrivers, csinodes, csistoragecapacities]
  verbs: [get, list, watch]
- apiGroups: [metrics.k8s.io]
  resources: [nodes, pods]
  verbs: [get, list]
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories, buckets]
  verbs: [get, list, watch]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [get, list, watch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: [get, list, watch]
- apiGroups: [notification.toolkit.fluxcd.io]
  resources: [alerts, providers, receivers]
  verbs: [get, list, watch]
- apiGroups: [fluxcd.controlplane.io]
  resources: [fluxinstances, fluxreports]
  verbs: [get, list, watch]
- apiGroups: [cert-manager.io]
  resources: [certificates, certificaterequests, issuers, clusterissuers]
  verbs: [get, list, watch]
- apiGroups: [monitoring.coreos.com]
  resources: [prometheusrules, servicemonitors, podmonitors, probes, scrapeconfigs]
  verbs: [get, list, watch]
- apiGroups: [longhorn.io]
  resources: [volumes, engines, replicas, nodes, backups, backupvolumes, recurringjobs]
  verbs: [get, list, watch]
- apiGroups: [topolvm.io]
  resources: [logicalvolumes]
  verbs: [get, list, watch]
- nonResourceURLs: [/healthz, /livez, /readyz, /version]
  verbs: [get]
